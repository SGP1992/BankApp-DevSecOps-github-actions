name: Docker Build and Push
on:
    workflow_dispatch:

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v4

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                username: ${{ vars.DOCKERHUB_USER}}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: build and push to docker hub
              uses: docker/build-push-action@v6
              with:
                context: .
                push: true
                tags: |
                    ${{ vars.DOCKERHUB_USER}}/BankApp-DevSecOps-github-actions:latest
                    ${{ vars.DOCKERHUB_USER}}/BankApp-DevSecOps-github-actions:${{ github.sha }}
                    ${{ vars.DOCKERHUB_USER}}/BankApp-DevSecOps-github-actions:${{ github.ref_name }}
